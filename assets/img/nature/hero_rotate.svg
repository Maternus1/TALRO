<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      font-family: Arial, sans-serif;
      font-weight: bold;
      fill: white;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
  </style>
  
  <circle cx="200" cy="200" r="150" fill="#1E90FF" />
  
  <!-- Main circular text -->
  <path id="curve" d="M100,200a100,100 0 1,1 200,0a100,100 0 1,1 -200,0" fill="transparent"/>
  <text width="400">
    <textPath xlink:href="#curve" startOffset="50%">
      <tspan dy="-20">Restore Ecosystems - Secure and Sustain</tspan>
    </textPath>
  </text>
  
  <!-- Inner circular text -->
  <path id="innerCurve" d="M125,200a75,75 0 1,1 150,0a75,75 0 1,1 -150,0" fill="transparent"/>
  <text width="400">
    <textPath xlink:href="#innerCurve" startOffset="50%" text-anchor="middle">
      <tspan dy="-10">Biodiversity and Livelihood</tspan>
    </textPath>
  </text>
  
  <!-- Optional center graphic (replace with your own if needed) -->
  <circle cx="200" cy="200" r="40" fill="#FF6B6B" />
</svg>